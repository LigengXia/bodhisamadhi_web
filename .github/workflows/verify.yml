name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `npm ci`, never `npm install` — fails loudly if the lockfile and
      # package.json disagree (Docs/3 §1).
      - run: npm ci

      # typecheck + lint + build + test — the gate on every phase (Docs/6 §1).
      - run: npm run verify
        env:
          # Placeholders — the build only needs these present, not real. Real
          # values live in Vercel and in .env.local, never in CI.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Local Supabase stack (Docker is preinstalled on ubuntu runners).
      - run: npx supabase start

      # `db reset` proves the migrations rebuild cleanly from scratch;
      # `db test` runs the pgTAP RLS suite — the security boundary (Docs/6 §Phase 2).
      - run: npx supabase db reset
      - run: npx supabase test db

      # The generated types must be in sync with the migrations.
      - run: npm run db:types
      - run: git diff --exit-code src/types/database.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Local Supabase (no R2 here — the R2-dependent assertions self-skip).
      - run: npx supabase start
      - run: npx supabase db reset

      # Expose the local stack's URL + keys the app and the fixtures read.
      - name: Export Supabase env
        run: |
          STATUS="$(npx supabase status -o json)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium

      # playwright.config builds and starts the app itself (webServer).
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
